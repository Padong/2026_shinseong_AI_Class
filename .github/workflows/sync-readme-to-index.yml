name: Sync README to index.md

on:
  push:
    branches: [main]
    paths:
      - 'README.md'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: README.md 내용을 index.md로 복사
        run: cp README.md index.md

      - name: 변경사항 있으면 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.md
          git diff --staged --quiet || git commit -m "index.md 자동 동기화 (README.md 변경 반영)"
          git push
